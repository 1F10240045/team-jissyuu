<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="シニア向け健康増進プロジェクト 23区対抗WALK">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="23区対抗WALK">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>23区対抗WALK</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 1. iPhone (iOS Safari / LINE) & Android Web 向けの加速度センサー歩数計ブリッジ
    window._webStepCount = 0;
    window._webMotionActive = false;
    window._lastStepTime = 0;
    window._lastMagnitude = 9.8;
    window._isPeak = false;

    // 2. 歩行中のみ加算する軽量GPS距離トラッカー（電車・車などの乗り物除外フィルター付き）
    window._webGpsDistanceMeters = 0.0;
    window._lastGpsLat = null;
    window._lastGpsLon = null;
    window._lastGpsTime = 0;
    window._gpsWatchId = null;

    // 2点間の緯度経度から距離(m)を算出するHaversine公式
    window._calcHaversineMeters = function(lat1, lon1, lat2, lon2) {
      var R = 6371000; // 地球半径(m)
      var toRad = Math.PI / 180;
      var dLat = (lat2 - lat1) * toRad;
      var dLon = (lon2 - lon1) * toRad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    };

    window._startWalkingGpsWatch = function() {
      if (!navigator.geolocation || window._gpsWatchId !== null) return;
      try {
        window._gpsWatchId = navigator.geolocation.watchPosition(
          function(pos) {
            var coords = pos.coords;
            // 精度が50mより悪いGPSノイズは無視
            if (!coords || (coords.accuracy && coords.accuracy > 50)) return;

            var now = Date.now();
            var lat = coords.latitude;
            var lon = coords.longitude;

            if (window._lastGpsLat !== null && window._lastGpsLon !== null) {
              var distM = window._calcHaversineMeters(
                window._lastGpsLat, window._lastGpsLon, lat, lon
              );
              var dtSec = (now - window._lastGpsTime) / 1000.0;

              // ★ 乗り物除外フィルター（ウォーキング＆ランニング両対応）：
              // ① 直近8秒以内に実際に歩数センサーが歩行・走行の着地振動をカウントしていること（電車・車での移動を除外）
              // ② 移動速度が秒速5.0m（時速18.0km＝元気なシニアのランニング・ジョギング上限）以下であること
              // ③ 1m以上の有意な移動であること（静止時のGPS揺らぎを除外）
              var isCurrentlyMovingOnFoot = (now - window._lastStepTime) <= 8000;
              var speedMps = dtSec > 0 ? (distM / dtSec) : 0;

              if (isCurrentlyMovingOnFoot && distM >= 1.0 && speedMps <= 5.0) {
                window._webGpsDistanceMeters += distM;
              }
            }

            window._lastGpsLat = lat;
            window._lastGpsLon = lon;
            window._lastGpsTime = now;
          },
          function(err) {
            // GPS未許可または室内で取得不可の場合は歩幅計算に自動フォールバックするためエラー無視
          },
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      } catch (_) {}
    };

    window._handleDeviceMotion = function(event) {
      var acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null || acc.y === null || acc.z === null) return;

      var mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      var delta = Math.abs(mag - window._lastMagnitude);
      window._lastMagnitude = mag;

      var now = Date.now();
      // 歩行・ランニング時の加速度変化ピークを検知（ハイピッチなランニングも拾えるよう最小間隔を230msに設定）
      if ((mag > 11.8 || delta > 2.4) && !window._isPeak) {
        if (now - window._lastStepTime > 230) {
          window._isPeak = true;
          window._lastStepTime = now;
          window._webStepCount += 1;
        }
      } else if (mag < 10.6 && delta < 1.5) {
        window._isPeak = false;
      }
    };

    window.requestWebMotionPermission = async function() {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          var permission = await DeviceMotionEvent.requestPermission();
          if (permission === 'granted') {
            if (!window._webMotionActive) {
              window.addEventListener('devicemotion', window._handleDeviceMotion, true);
              window._webMotionActive = true;
            }
            window._startWalkingGpsWatch();
            return 'granted';
          } else {
            return 'denied';
          }
        } else if (typeof DeviceMotionEvent !== 'undefined') {
          if (!window._webMotionActive) {
            window.addEventListener('devicemotion', window._handleDeviceMotion, true);
            window._webMotionActive = true;
          }
          window._startWalkingGpsWatch();
          return 'granted';
        } else {
          return 'unsupported';
        }
      } catch (e) {
        console.error('Motion permission error:', e);
        return 'error:' + e.message;
      }
    };

    window.getWebStepCount = function() {
      return window._webStepCount || 0;
    };

    window.getWebGpsDistanceMeters = function() {
      return window._webGpsDistanceMeters || 0.0;
    };

    // 古いService Workerのキャッシュ自動解除
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
